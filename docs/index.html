<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Ranní moudro</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
</head>
<body>
  <main id="app">
    <article id="card" hidden>
      <p class="book"><span id="book-title"></span> <span class="sep">·</span> <span id="book-author"></span></p>
      <h1 id="theme"></h1>
      <div id="body"></div>
      <p class="verified" id="verified" hidden>✓ jádro ověřeno</p>
    </article>

    <button id="more" type="button" hidden>Další moudro →</button>

    <div id="status" class="status">Načítám…</div>

    <footer>
      <span>Ranní moudra</span>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
