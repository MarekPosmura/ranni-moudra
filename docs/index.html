<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Ranní moudro</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
</head>
<body>
  <main id="app">
    <nav id="nav">
      <a href="?" id="home-link">Ranní moudra</a>
      <a href="?view=catalog" id="catalog-link">📖 Katalog</a>
    </nav>

    <article id="card" hidden>
      <p class="book">
        <a id="book-link" href="?">
          <span id="book-title"></span> <span class="sep">·</span> <span id="book-author"></span>
        </a>
      </p>
      <h1 id="theme"></h1>
      <div id="body"></div>
      <p class="verified" id="verified" hidden>✓ jádro ověřeno</p>
    </article>

    <section id="list" hidden>
      <a href="#" id="list-back" class="back" hidden>← Zpět</a>
      <h1 id="list-title"></h1>
      <p id="list-sub" class="list-sub" hidden></p>
      <div id="list-items"></div>
    </section>

    <button id="more" type="button" hidden>Další moudro →</button>

    <div id="status" class="status">Načítám…</div>

    <footer>
      <span>Ranní moudra</span>
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
